name: License Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-license-check:
    name: Backend License Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate third-party license report
        run: ./mvnw org.codehaus.mojo:license-maven-plugin:2.7.1:add-third-party -q

      - name: Fail on disallowed licenses
        shell: bash
        run: |
          DISALLOWED="GPL|AGPL|SSPL|BSL|Business Source License"

          if grep -Ei "$DISALLOWED" target/generated-sources/license/THIRD-PARTY.txt; then
            echo "::error::Disallowed license found in backend dependencies"
            exit 1
          fi

          echo "No disallowed licenses found."

  frontend-license-check:
    name: Frontend License Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run license audit
        shell: bash
        run: |
          npx license-checker \
            --production \
            --summary \
            --onlyAllow "MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense"