name: 'CI'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  license-check:
    name: Frontend License Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run license audit
        run: npx license-checker --production --summary --failOn "GPL-2.0;GPL-3.0;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later"



