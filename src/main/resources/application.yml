spring:
  security:
    user:
      name: admin
      password: somepassword
      
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/los_db}
    username: postgres
    password: sujan2003

    hikari:
      pool-name: LOS-HikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: create

    show-sql: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always
logging:
  level:
    org.flywaydb: DEBUG
los:

  jwt:
    secret: ${JWT_SECRET:los-dev-secret-min-32-chars-change-in-prod!!}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:15}

  scoring:

    weights:

      income-ratio: 30
      debt-burden: 25
      employment-stability: 20
      repayment-history: 15
      loan-purpose-risk: 10

      income-ratio-full-threshold: 0.20
      income-ratio-high-threshold: 0.10
      income-ratio-medium-threshold: 0.05

      debt-burden-low-threshold: 0.10
      debt-burden-moderate-threshold: 0.30
      debt-burden-high-threshold: 0.50
      debt-burden-severe-threshold: 0.70

  workflow:
    stages:
      - LOAN_OFFICER
      - BRANCH_MANAGER
      - CREDIT_COMMITTEE

  fineract:
    base-url: ${FINERACT_BASE_URL:https://localhost/fineract-provider/api/v1}

    tenant-id: ${FINERACT_TENANT_ID:default}

    username: ${FINERACT_USERNAME:mifos}

    password: ${FINERACT_PASSWORD:password}

    mock-enabled: ${FINERACT_MOCK_ENABLED:true}

    connect-timeout-ms: 5000

    read-timeout-ms: 10000

    default-transaction-processing-strategy-code: "1"

    default-frequency-type: "2"

    default-repayment-every: 1

    default-interest-rate-per-period: "12"

    locale: en

    date-format: "dd MMMM yyyy"
    